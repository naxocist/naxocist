{% extends "base.html" %}

{% block title %}notes{% endblock %}

{% block content %}
<h1>Archive</h1>

{% set sorted = section.pages | sort(attribute="date") | reverse %}
{% for page in sorted %}
<p>
  <span style="color:#666;font-size:0.85em">{{ page.date }}</span><br>
  <a href="{{ page.permalink }}">{{ page.title }}</a>
</p>
{% endfor %}
{% endblock %}
