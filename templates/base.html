<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}naxocist{% endblock %}</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    @font-face {
      font-family: "Adwaita Sans";
      src: url("/fonts/AdwaitaSans-Regular.woff2") format("woff2");
      font-weight: 100 900;
      font-display: swap;
    }
    @font-face {
      font-family: "Adwaita Sans";
      src: url("/fonts/AdwaitaSans-Italic.woff2") format("woff2");
      font-weight: 100 900;
      font-style: italic;
      font-display: swap;
    }
    body {
      max-width: 650px;
      margin: 40px auto;
      padding: 0 20px;
      font: 18px/1.6 "Adwaita Sans", sans-serif;
      font-optical-sizing: auto;
      color: #ddd;
      background: #111;
    }
    a { color: #5b9cf6; text-decoration: none; }
    a:hover { text-decoration: underline; }
    img { max-width: 100%; }
    hr { border: none; border-top: 1px solid #333; margin: 2rem 0; }
    nav { margin-bottom: 2rem; }
    nav a { margin-right: 1rem; }
  </style>
</head>
<body>
  <nav>
    <a href="/">home</a>
    <a href="/projects">projects</a>
    <a href="/notes">notes</a>
  </nav>
  {% block content %}{% endblock %}
  <hr>
  <footer style="color:#666;font-size:0.85rem">made with suffering and <a href="https://www.getzola.org" target="_blank">zola</a></footer>
</body>
</html>
